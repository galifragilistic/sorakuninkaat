# Builds SoRalli for Windows and macOS.
#   dev:    every push builds the game; download it from the run's artifacts to test.
#   master: every push builds the game and publishes it as a GitHub release.
name: Build

on:
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable
  TEMPLATES_DIR: ~/.local/share/godot/export_templates/4.7.2.stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          rm godot.zip
          godot --version

      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_RELEASE }}-win-mac

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p ${{ env.TEMPLATES_DIR }}
          # Only what the export presets need, not the whole 1.3 GB package.
          unzip -q -j templates.tpz 'templates/version.txt' 'templates/macos.zip' \
            'templates/windows_release_x86_64.exe' 'templates/windows_debug_x86_64.exe' \
            -d ${{ env.TEMPLATES_DIR }}
          rm templates.tpz

      - name: Import assets
        run: godot --headless --import

      - name: Export
        run: |
          mkdir -p build/windows build/macos dist
          godot --headless --export-release "Windows Desktop" build/windows/SoRalli.exe
          # Outside macOS the app bundle is exported as a zip.
          godot --headless --export-release "macOS" dist/SoRalli-macOS.zip
          (cd build/windows && zip -q ../../dist/SoRalli-Windows.zip SoRalli.exe)
          ls -la dist
          test -s dist/SoRalli-Windows.zip
          test -s dist/SoRalli-macOS.zip

      - name: Upload test build
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: SoRalli-dev-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 14

      - name: Publish release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          gh release create "$tag" dist/*.zip \
            --target "${{ github.sha }}" \
            --title "SoRalli $(date -u +%-d.%-m.%Y) (build ${{ github.run_number }})" \
            --generate-notes
