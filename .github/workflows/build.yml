# Builds SoRalli for Windows and macOS.
#   dev:    every push builds the game; download it from the run's artifacts to test.
#   master: every push builds the game and publishes it as a GitHub release
#           tagged v<version>, with the version's CHANGELOG.md section as notes.
# The version is application/config/version in project.godot (see CHANGELOG.md).
name: Build

on:
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable
  TEMPLATES_DIR: ~/.local/share/godot/export_templates/4.7.2.stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)
          if [ -z "$version" ]; then
            echo "::error::application/config/version missing from project.godot"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Check release notes
        if: github.ref == 'refs/heads/master'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released. Raise the version in project.godot and add it to CHANGELOG.md."
            exit 1
          fi
          heading=$(grep -m1 "^## \[$VERSION\]" CHANGELOG.md || true)
          if ! echo "$heading" | grep -qE "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$"; then
            echo "::error::CHANGELOG.md needs a dated heading '## [$VERSION] - YYYY-MM-DD' (found: '$heading')."
            exit 1
          fi
          # The section body, up to the next version heading or the link list.
          awk -v h="$heading" '
            $0 == h { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > release_notes.md
          cat release_notes.md
          test -s release_notes.md

      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          rm godot.zip
          godot --version

      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_RELEASE }}-win-mac

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p ${{ env.TEMPLATES_DIR }}
          # Only what the export presets need, not the whole 1.3 GB package.
          unzip -q -j templates.tpz 'templates/version.txt' 'templates/macos.zip' \
            'templates/windows_release_x86_64.exe' 'templates/windows_debug_x86_64.exe' \
            -d ${{ env.TEMPLATES_DIR }}
          rm templates.tpz

      - name: Import assets
        run: godot --headless --import

      - name: Export
        run: |
          mkdir -p build/windows build/macos dist
          godot --headless --export-release "Windows Desktop" build/windows/SoRalli.exe
          # Outside macOS the app bundle is exported as a zip.
          godot --headless --export-release "macOS" dist/SoRalli-macOS.zip
          (cd build/windows && zip -q ../../dist/SoRalli-Windows.zip SoRalli.exe)
          ls -la dist
          test -s dist/SoRalli-Windows.zip
          test -s dist/SoRalli-macOS.zip

      - name: Upload test build
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: SoRalli-${{ steps.version.outputs.version }}-dev-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 14

      - name: Publish release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.zip \
            --target "${{ github.sha }}" \
            --title "SoRalli $VERSION" \
            --notes-file release_notes.md
